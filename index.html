
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Diskon Belanja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Kalkulator Diskon</h1>
        <p>Hitung diskon belanja dengan mudah!</p>

        <label for="nama">Nama Barang</label>
        <input type="text" id="nama" placeholder="Contoh: Sepatu">

        <label for="harga">Harga Barang (Rp)</label>
        <input type="number" id="harga" placeholder="Contoh: 150000">

        <label for="jumlah">Jumlah Barang</label>
        <input type="number" id="jumlah" placeholder="Contoh: 2">

        <button onclick="hitungDiskon()">Hitung Total</button>

        <div id="hasil"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
